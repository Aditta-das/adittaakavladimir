    pointer-events: none;

  /* CRT flicker */
  @keyframes flicker {
    0%,100% { opacity:1 }
    92% { opacity:1 }
    93% { opacity:0.85 }
    94% { opacity:1 }
    96% { opacity:0.9 }
    97% { opacity:1 }
  }
  body { animation: flicker 8s infinite; }

  #terminal {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
    position: relative;
  }

  /* Boot sequence */

    position: fixed;

  #topbar {

    margin-right: 6px;
  }
  .dot-r { background: #ff5f56; }
  .dot-y { background: #ffbd2e; }
  .dot-g { background: #27c93f; }

  /* Main terminal window */
  #window {
    border: 1px solid var(--green-dim);
    background: rgba(0,10,0,0.97);
    padding: 16px;
    min-height: calc(100vh - 80px);
    position: relative;

  /* Output area */
  #output {
    white-space: pre-wrap;
    word-break: break-word;
  }

  .line { display: block; }

  /* Input row */
  #input-row {
    display: flex;
    align-items: center;
    margin-top: 4px;
    flex-wrap: nowrap;
  }

  #prompt {
    color: var(--green);
    white-space: nowrap;
    margin-right: 4px;
    font-size: 14px;
  }
  #prompt.root { color: var(--red); }

  #cmd-input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    flex: 1;
    caret-color: var(--green);
  }
  #cmd-input.root-mode { color: var(--red); caret-color: var(--red); }

  /* Typed output styles */
  .cmd-echo { color: var(--white); }
  .grn  { color: var(--green); }
  .red  { color: var(--red); }
  .yel  { color: var(--yellow); }
  .cyn  { color: var(--cyan); }
  .dim  { color: var(--gray); }
  .bold { font-weight: bold; font-family: 'VT323', monospace; font-size: 18px; }

  /* File listing */
  .ls-item {
    display: inline-block;
    margin-right: 20px;
    color: var(--cyan);
  }
  .ls-dir { color: var(--green); }
  .ls-exec { color: var(--yellow); }

  /* Glitch on banner */
  @keyframes glitch {
    0%,100% { text-shadow: 2px 0 var(--red), -2px 0 var(--cyan); }
    20% { text-shadow: -3px 0 var(--red), 3px 0 var(--cyan); clip-path: inset(10% 0 80% 0); }
    40% { text-shadow: 3px 2px var(--red), -3px -2px var(--cyan); }
    60% { text-shadow: 0 0 0; }
  }
  .glitch-text {
    animation: glitch 4s infinite;
    color: var(--green);

  /* Blinking cursor */

  .cursor {
    display: inline-block;
    width: 8px; height: 15px;
    background: var(--green);
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
    margin-left: 2px;

    background: var(--green);

  /* Mobile */
  @media(max-width:600px){
    body { font-size: 12px; }
    #terminal { padding: 8px; }

function runMatrix() {
  print('<span class="grn">Initiating matrix rain... (runs for 3 seconds)</span>');

  const cols = 60;
  const rows = 10;
  let frames = 30;
  const iv = setInterval(() => {
    let grid = '';
    for (let r = 0; r < rows; r++) {
      let row = '';
      for (let c = 0; c < cols; c++) {
        const bright = Math.random() > 0.9;
        const ch = chars[Math.floor(Math.random()*chars.length)];
        row += bright ? `<span style="color:#fff">${ch}</span>` : `<span style="color:#00ff41">${ch}</span>`;
      }
      grid += row + '\n';
    }
    const el = document.getElementById('matrix-live');
    if (el) el.innerHTML = grid;
    frames--;
    if (frames <= 0) {
      clearInterval(iv);
      if (el) el.innerHTML = '<span class="grn">Wake up, Neo... The Matrix has you.</span>';
    }
  }, 100);

  const out = document.getElementById('output');
  const div = document.createElement('div');
  div.id = 'matrix-live';
  div.style.fontFamily = 'Share Tech Mono, monospace';
  div.style.lineHeight = '1.2';
  out.appendChild(div);
  scrollBottom();
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function print(html, newline=true) {
  const out = document.getElementById('output');
  const div = document.createElement('div');
  div.innerHTML = html + (newline ? '' : '');
  out.appendChild(div);
  scrollBottom();
}
function scrollBottom() {
  window.scrollTo(0, document.body.scrollHeight);
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ─── INPUT HANDLING ───────────────────────────────────────────────────────────
document.getElementById('cmd-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const val = this.value;
    this.value = '';
    process(val);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < cmdHistory.length - 1) {
      histIdx++;
      this.value = cmdHistory[histIdx] || '';
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) {
      histIdx--;
      this.value = cmdHistory[histIdx] || '';
    } else {
      histIdx = -1;
      this.value = '';
    }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const files = ['skills.txt','projects.txt','ctf.txt','contact.txt','secret.txt'];
    const v = this.value;
    if (v.startsWith('cat ')) {
      const partial = v.slice(4);
      const match = files.find(f => f.startsWith(partial));
      if (match) this.value = 'cat ' + match;
    }
  } else if (e.ctrlKey && e.key === 'l') {
    e.preventDefault();
    document.getElementById('output').innerHTML = '';
  } else if (e.ctrlKey && e.key === 'c') {
    e.preventDefault();
    print(`<span class="${isRoot?'red':'grn'}">${isRoot?'root@vladimirovichputin:~#':'Aditta@vladimirovichputin:~$'}</span> <span class="cmd-echo">${escHtml(this.value)}</span>^C`);
    this.value = '';
  }
});
